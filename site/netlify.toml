# Netlify configuration for vikemarketing.com
# Publish directory is this folder itself (plain static HTML, no build step).
[build]
  publish = "."

# Redirect the Netlify subdomain and www to the canonical domain once the custom domain is live.
# Uncomment and replace YOUR-SITE with your Netlify site name.
# [[redirects]]
#   from = "https://YOUR-SITE.netlify.app/*"
#   to = "https://vikemarketing.com/:splat"
#   status = 301
#   force = true

[[redirects]]
  from = "https://www.vikemarketing.com/*"
  to = "https://vikemarketing.com/:splat"
  status = 301
  force = true

# Old single-page anchors / legacy file name
[[redirects]]
  from = "/vike.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://api.telegram.org https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' mailto:"

# CSS/JS are versioned (?v=hash) and font files have hashed names, so they can be cached for a year.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
